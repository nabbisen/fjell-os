# fleet-demo.toml — RFC-v0.10-005 three-node QEMU fleet topology.
# Used by `cargo xtask fleet-demo`.

schema_version = 1
fleet_name     = "fjell-demo-fleet"

# ── Nodes ──────────────────────────────────────────────────────────────────
# node-A is the coordinator.  node-B and node-C are members.

[[nodes]]
id       = "node-a"
role     = "coordinator"
qemu_port_serial = 4440
qemu_port_gdb    = 0     # 0 = disabled

[[nodes]]
id       = "node-b"
role     = "member"
qemu_port_serial = 4441
qemu_port_gdb    = 0

[[nodes]]
id       = "node-c"
role     = "member"
qemu_port_serial = 4442
qemu_port_gdb    = 0

# ── Expected markers for `fleet-demo verify` ───────────────────────────────
# NOT declared here. `fleet-demo verify` reads its markers and timeout from
# `tests/qemu/profiles/fleet-demo.toml`, the profile every other runner reads
# (this block used to carry a second copy that nothing read; they were edited
# separately and agreed only by luck). The node topology above is still read
# from nowhere: `crates/fjell-tools/src/fleet_demo.rs` hard-codes the three
# ports and roles, and that duplication is recorded, not fixed (RFC-0.50-004).

# ── Demo bundle ────────────────────────────────────────────────────────────
[bundle]
service = "fjell-hello"
version = "1.0.0"
path    = "examples/three-node-fleet/fjell-hello"
