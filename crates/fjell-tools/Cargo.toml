[package]
name = "fjell-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# This crate always targets the host, not the bare-metal RISC-V target.
# Build it with: cargo build --package fjell-tools --target x86_64-unknown-linux-gnu

[[bin]]
name = "fjell-tools"
path = "src/main.rs"

[dependencies]
fjell-dev-harness       = { path = "../fjell-dev-harness" }
fjell-cap-manifest      = { path = "../fjell-cap-manifest" }
fjell-sig-ed25519       = { path = "../fjell-sig-ed25519" }
# RFC-0.29-002 §7: the one shared ERRATA.md table parser, so Gate 7 reads
# the same structure `errata-tracking`/`errata-limitations` do instead of
# carrying its own copy (or, worse, its own `grep`).
fjell-consistency-check = { path = "../../tools/fjell-consistency-check" }
fjell-schema           = { path = "../fjell-schema" }
getrandom           = { version = "0.2", features = ["std"] }
argon2              = "0.5"
aes-gcm             = "0.10"
# RFC-0.38-001 R6: an SHA-256 that is not the in-tree one the kernel runs, so the
# host recomputation of the image-set digest is evidence and not an echo. Already
# in Cargo.lock (`fjell-repro-check` uses the same version).
sha2                = "0.10"

[dev-dependencies]
# RFC-0.38-001 R6: one test checks the host recomputation against the in-tree
# implementation on the real prebuilt images. Test-only.
fjell-measure-format = { path = "../formats/fjell-measure-format" }
