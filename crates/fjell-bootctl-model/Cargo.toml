[package]
name = "fjell-bootctl-model"
description = "Model-based state-machine tests for Fjell OS (RFC v0.6-002)."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "fjell_bootctl_model"
path = "src/lib.rs"

[dependencies]
proptest = "1.6"

[dev-dependencies]
proptest = "1.6"
# RFC-0.33-001 D1: the model's first dependent. `tests/refines.rs` runs the
# same operation sequences through this model and through the state machine on
# `BootControlBlock` and compares them after every step. It is a
# dev-dependency because the model is a specification to check an
# implementation against, not something a service links.
fjell-upgrade-format = { path = "../formats/fjell-upgrade-format" }
