[package]
name         = "fjell-neg-test"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "fjell-neg-test"
path = "src/main.rs"

[dependencies]
fjell-abi         = { path = "../../fjell-abi" }
fjell-cap         = { path = "../../fjell-cap" }
fjell-syscall     = { path = "../../fjell-syscall" }
fjell-service-api = { path = "../../fjell-service-api" }
# RFC-0.40-002: the decoder `auditd` uses, so a revocation can be asserted by name.

[package.metadata.fjell]
service-id = "svc.neg-test"
