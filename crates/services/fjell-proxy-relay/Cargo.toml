[package]
name = "fjell-proxy-relay"
description = "Asks semantic-stream for messages on proxy-text's behalf, so a presentation that blocks blocks only this task (RFC-0.34-001 D5/D8)."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "fjell-proxy-relay"
path = "src/main.rs"

[dependencies]
fjell-syscall     = { path = "../../fjell-syscall" }
fjell-service-api = { path = "../../fjell-service-api" }
