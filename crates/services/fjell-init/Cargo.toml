[package]
name = "fjell-init"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
[[bin]]
name = "fjell-init"
path = "src/main.rs"
[dependencies]
fjell-cap = { path = "../../fjell-cap" }
fjell-abi              = { path = "../../fjell-abi" }
