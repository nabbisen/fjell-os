[package]
name = "fjell-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "fjell-kernel"
path = "src/main.rs"
# RFC-0.50-001 D8 (E-134): the kernel has NO tests of its own and cannot compile any on the host -- it is a `no_std` binary
# with its own `panic_handler`, and the host test harness links `std`, which already defines one (`cargo test -p fjell-kernel`
# used to answer "could not compile ... due to 19 previous errors"). Its decidable logic is tested in three crates it depends on
# (`fjell-user-ptr`, `fjell-lease`, `fjell-task`), and its boot behaviour by the QEMU tiers. `test = false` makes the command say
# "nothing to run" instead of an error that looks like breakage; the `dead-tests` subcheck is what makes "nothing" true -- it fails
# the day a `#[test]` or `#[cfg(test)]` appears in this crate (which would otherwise sit here, uncompiled, reporting coverage it
# has not got: E-134).
test = false

[dependencies]
fjell-audit-format = { path = "../formats/fjell-audit-format" }
fjell-abi = { path = "../fjell-abi" }
fjell-cap = { path = "../fjell-cap" }
fjell-fdt-header = { path = "../fjell-fdt-header" }
# RFC-0.40-003: the frame allocator, address types and MmError (E-100).
fjell-frame-alloc = { path = "../fjell-frame-alloc" }
fjell-ipc = { path = "../fjell-ipc" }
# RFC-0.50-001: the kernel's decidable logic, extracted so that its tests run on the host.
fjell-lease = { path = "../fjell-lease" }
fjell-task = { path = "../fjell-task" }
fjell-user-ptr = { path = "../fjell-user-ptr" }
# RFC-0.38-001 R2: SHA-256 and the image-set digest. `fjell-canon` (no dependencies,
# forbid(unsafe_code)) comes with it.
fjell-measure-format = { path = "../formats/fjell-measure-format" }
