# GitHub Actions CI for Fjell OS.
#
# Job topology:
#   ci-format          — cargo fmt --check
#   ci-check           — cargo check (host-buildable crates)
#   ci-cross-check     — cargo check (RISC-V service + kernel crates)
#   ci-test-host       — host unit tests
#   ci-docs            — mdbook build
#   ci-qemu-smoke      — qemu-test m1..m8
#   ci-negative-matrix — derives the category list ci-qemu-negative's
#                        matrix runs (RFC-0.29-001 D1: tests/qemu/profiles/
#                        *.toml is the authority, not a list here)
#   ci-qemu-negative   — qemu-negative <cat>, once per derived category
#   ci-host-bins       — cargo test --bins/--tests, the crates ci-test-host's
#                        --lib cannot reach (RFC-0.29-001 R1, E-013)
#   ci-repro-check     — the real two-build reproducibility check: builds
#                        the kernel + all services twice, independently, and
#                        compares bit-for-bit (RFC-0.30-001 §5, E-036)

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'  # Weekly: every job, including the full fuzz run (ci-fuzz-run)
  # RFC-0.32-001 D5: run on demand, so a fix to the fuzz harness or a decoder
  # is proven the day it lands rather than the following Monday.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTC_BOOTSTRAP: 1
  RUST_BACKTRACE: 1

jobs:
  ci-format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      - name: cargo fmt --check
        run: cargo fmt --all --check

  ci-check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      - name: cargo check (host-buildable crates)
        # Covers format/api/tools crates plus the enforcement and syscall
        # libraries added in v0.2.  The RISC-V kernel and service binaries
        # are covered by ci-cross-check.
        run: |
          cargo check \
              -p fjell-tools \
              -p fjell-cap \
              -p fjell-ipc \
              -p fjell-syscall \
              -p fjell-service-api \
              -p fjell-cap-broker \
              -p fjell-neg-test \
              -p fjell-service-manager \
              -p fjell-bootctl \
              -p fjell-attestation-format \
              -p fjell-audit-format \
              -p fjell-block-format \
              -p fjell-config-format \
              -p fjell-device-format \
              -p fjell-measure-format \
              -p fjell-recovery-format \
              -p fjell-rootfs-format \
              -p fjell-semantic-format \
              -p fjell-snapshot-format \
              -p fjell-store-format \
              -p fjell-upgrade-format \
              -p fjell-verify-format

  ci-cross-check:
    name: cross-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # `llvm` gives llvm-objcopy/llvm-nm (qemu.rs:181,242); `ld.lld` is in
      # the separate `lld` package. No job installed it before RFC-0.31-002
      # because every one of them died at -Z build-std long before a linker
      # was reached.
      - name: Install LLVM binutils and ld.lld
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm lld
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      - name: cargo check (riscv64gc-unknown-none-elf)
        # Type-checks the kernel and all service binaries for the RISC-V
        # bare-metal target.  This catches register-constant gaps, wrong
        # import paths, and asm errors that the host ci-check cannot see.
        # Requires rust-src for -Z build-std.
        run: |
          cargo check \
              --target riscv64gc-unknown-none-elf \
              -Z build-std=core,compiler_builtins \
              -p fjell-kernel \
              -p fjell-init \
              -p fjell-auditd \
              -p fjell-cap-broker \
              -p fjell-neg-test \
              -p fjell-bootctl \
              -p fjell-service-manager \
              -p fjell-sample-service

  ci-test-host:
    name: test-host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      - name: cargo test (host-pure crates)
        # Includes fjell-cap (16 enforcement tests) and fjell-ipc (10 endpoint
        # tests) added in v0.2, in addition to the format/api/tools crates.
        run: |
          cargo test --lib --bins \
              -p fjell-tools \
              -p fjell-cap \
              -p fjell-ipc \
              -p fjell-attestation-format \
              -p fjell-audit-format \
              -p fjell-block-format \
              -p fjell-config-format \
              -p fjell-device-format \
              -p fjell-measure-format \
              -p fjell-recovery-format \
              -p fjell-rootfs-format \
              -p fjell-semantic-format \
              -p fjell-service-api \
              -p fjell-snapshot-format \
              -p fjell-store-format \
              -p fjell-upgrade-format \
              -p fjell-verify-format


  ci-test-services:
    name: test-services
    runs-on: ubuntu-24.04
    needs: [ci-check]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      - name: Test additional lib crates
        run: |
          cargo test \
            -p fjell-arch \
            -p fjell-abi \
            -p fjell-trust-provider \
            -p fjell-keyring \
            -p fjell-arch-riscv64 \
            -p fjell-fleet-format \
            -p fjell-remote-diag-format \
            -p fjell-policy-format \
            -p fjell-semantic-stream \
            -p fjell-proxy-text \
            -p fjell-semantic-fanout \
            -p fjell-braille \
            -p fjell-ci-coverage \
            --lib
      - name: Cross-check service binaries (RISC-V)
        env:
          RUSTC_BOOTSTRAP: 1
        run: |
          cargo check \
            -p fjell-summaryd -p fjell-syncd \
            -p fjell-netd -p fjell-diagnosticsd \
            -p fjell-recoveryd -p fjell-attestd -p fjell-measuredd \
            -p fjell-configd -p fjell-devmgr \
            -p fjell-storaged -p fjell-upgraded -p fjell-powerd \
            -p fjell-verifyd -p fjell-rootfsd -p fjell-snapshotd \
            -p fjell-driver-virtio-blk \
            -p fjell-driver-virtio-net -p fjell-secure-transportd \
            -p fjell-fleetd \
            -p fjell-semantic-stream -p fjell-proxy-text -p fjell-proxy-braille -p fjell-svc-presentation-fault \
            --target riscv64gc-unknown-none-elf \
            -Z build-std=core,compiler_builtins

  ci-docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Pinned in docs/MDBOOK.lock (RFC-0.32-003 D17); consistency-check's
      # toolchain-declarations fails if this version and that file disagree.
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
          mdbook --version
      - name: mdbook build
        run: cd docs && mdbook build

  # RFC-0.32-004 D4/D5 — published advisories against every tracked Cargo.lock.
  #
  # Every event, not only the schedule: a push can *add* a vulnerable crate,
  # and the schedule catches an advisory *published* against a lockfile that
  # did not change. Both are the case this job exists for, and the check takes
  # seconds.
  #
  # It needs the network, which no release-rehearsal Gate does. So it is not a
  # Gate: CI records it and the cut reads the record, the way exit criterion 9
  # reads a CI run (RFC-0.31-002 D7). The rule a cut applies — a green run
  # against the release commit's exact Cargo.lock, database no more than 7 days
  # old — is in docs/src/releasing/v0-release-cycle.md.
  #
  # Exit 1 is a finding; exit 2 is a run that could not tell, including an
  # advisory database too old to trust. Both are red. Neither is a pass.
  ci-dependency-advisories:
    name: dependency-advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      # The version is read from the script, which refuses to run under any
      # other: one declaration, not a second copy here to drift from it.
      - name: Install cargo-audit (pinned by the check itself)
        run: |
          version=$(sed -n 's/^PINNED_AUDIT="\(.*\)"$/\1/p' .github/scripts/dependency-advisories.sh)
          [ -n "$version" ] || { echo "::error::no PINNED_AUDIT in the check script"; exit 1; }
          cargo install cargo-audit --locked --version "$version"
          cargo audit --version
      - name: Check every Cargo.lock against the RustSec advisory database
        run: .github/scripts/dependency-advisories.sh

  # RFC-0.32-003 D18 — publish the book.
  #
  # A built book that is thrown away cannot be "documentation that can be
  # found", and ci-docs above builds and discards it. Pages is configured for
  # this repository with build_type: workflow, which means nothing is served
  # until a job deploys — a branch push will not do it.
  #
  # Only on `main`, and only after ci-docs has built the same book with the
  # same pinned mdBook. `needs: ci-docs` is what stops a book that fails to
  # build from being published over one that did.
  ci-pages:
    name: pages
    runs-on: ubuntu-24.04
    needs: [ci-docs]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Two pushes landing together must not race each other onto the site; the
    # later one wins and the earlier is cancelled rather than interleaved.
    # A later deploy queues behind an earlier one rather than cancelling it.
    # With cancel-in-progress, criterion 9's own dispatch of the release commit
    # cancelled that commit's push-run deploy: every cut hit it, found at the
    # 0.32.0 cut. Both deploys serve the same commit, so queueing costs a
    # redundant deploy and never serves an older tree.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
          mdbook --version
      - name: Build the book
        run: cd docs && mdbook build
      # A positive control on the artifact: the ADRs were the 41 pages E-050
      # found in no book, so an upload that does not contain them is not the
      # book this line produced, whatever mdbook exited with.
      - name: The built site contains the ADRs
        run: |
          count=$(ls docs/book/adr/*.html | wc -l)
          echo "ADR pages built: $count"
          [ "$count" -ge 30 ] || { echo "::error::only $count ADR pages in the built site"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/book
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  ci-qemu-smoke:
    name: qemu-smoke
    runs-on: ubuntu-24.04
    needs: [ci-check]
    strategy:
      fail-fast: false
      matrix:
        # RFC-0.31-002 D5 / E-040: m1-m6 were deleted from
        # crates/fjell-tools/src/smoke.rs by RFC-0.31-001 - the kernel
        # prints no TEST:M1..M6:PASS marker, so nothing could ever have
        # passed them. Between that line and this one the six failed at
        # argument parsing (`unknown milestone`), which is what run
        # 34655244163 shows. m7/m8 going green in the same run as this
        # edit is the proof the matrix change is a deletion of dead
        # entries and not a narrowing of coverage.
        milestone: [m7, m8]
    steps:
      - uses: actions/checkout@v7
      # `llvm` gives llvm-objcopy/llvm-nm (qemu.rs:181,242); `ld.lld` is in
      # the separate `lld` package. No job installed it before RFC-0.31-002
      # because every one of them died at -Z build-std long before a linker
      # was reached.
      - name: Install QEMU, LLVM binutils and ld.lld
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc qemu-utils llvm lld
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      - name: cargo xtask qemu-test ${{ matrix.milestone }}
        run: cargo xtask qemu-test ${{ matrix.milestone }}
      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-smoke-${{ matrix.milestone }}
          path: tests/qemu/artifacts/smoke-${{ matrix.milestone }}/
          if-no-files-found: warn

  ci-negative-matrix:
    name: negative-matrix
    runs-on: ubuntu-24.04
    outputs:
      categories: ${{ steps.derive.outputs.categories }}
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      # RFC-0.29-001 D1/R3/R4: the matrix below used to be a fifth
      # hand-typed copy of "the negative-test categories" (nine names,
      # missing semantic/uart-rx/uart-rx-unbound, which test-all already
      # ran and this workflow never had). `tests/qemu/profiles/*.toml` is
      # the one authority now; this job's only purpose is to hand that
      # list to ci-qemu-negative's matrix as JSON, since a workflow
      # `strategy.matrix` cannot itself run a program to compute its own
      # entries.
      - name: Derive negative-test categories
        id: derive
        run: echo "categories=$(cargo xtask list-negative-categories)" >> "$GITHUB_OUTPUT"

  ci-qemu-negative:
    name: qemu-negative
    runs-on: ubuntu-24.04
    needs: [ci-check, ci-negative-matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.ci-negative-matrix.outputs.categories) }}
    steps:
      - uses: actions/checkout@v7
      # `llvm` gives llvm-objcopy/llvm-nm (qemu.rs:181,242); `ld.lld` is in
      # the separate `lld` package. No job installed it before RFC-0.31-002
      # because every one of them died at -Z build-std long before a linker
      # was reached.
      - name: Install QEMU, LLVM binutils and ld.lld
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc qemu-utils llvm lld
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      # RFC-0.29-001 D5: store/upgrade are derived into this matrix like
      # any other category (they have real profiles) but are not
      # release-gated — continue-on-error reports their real result
      # without turning the whole workflow red over a disclosed,
      # already-tracked gap (v1-limitations.md).
      - name: cargo xtask qemu-negative ${{ matrix.category }}
        continue-on-error: ${{ matrix.release_gated == false }}
        run: cargo xtask qemu-negative ${{ matrix.category }}
      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-negative-${{ matrix.category }}
          path: tests/qemu/artifacts/${{ matrix.category }}/
          if-no-files-found: warn

  # ── v0.7.x hardening gates (RFC-v0.7.1-002) ──────────────────────────────

  ci-test-v07-formats:
    name: test-v07-formats
    runs-on: ubuntu-24.04
    needs: [ci-check]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      - name: Test v0.4-v0.7 format crates
        # RFC-0.29-001 named this guard and did not apply it here: excluding
        # the bare-metal crates removes fjell-secure-transportd, the edge
        # that was silently turning fjell-sxt-crypto's
        # crypto-profile-development on for the whole graph via feature
        # unification, so its own compile_error! guard fires for real. The
        # flag is the one ci-host-bins already passes
        # (cargo_metadata.rs:309), stated deliberately rather than inherited
        # by accident.
        run: |
          cargo test \
            --features fjell-sxt-crypto/crypto-profile-development \
            -p fjell-net-format \
            -p fjell-sxt-crypto \
            -p fjell-diag-format \
            -p fjell-platform-format \
            -p fjell-semantic-v1 \
            -p fjell-dtb-derive \
            -p fjell-identity-format \
            -p fjell-summary-format \
            -p fjell-snapshot-format \
            --lib

  ci-proptest:
    name: proptest
    runs-on: ubuntu-24.04
    needs: [ci-check]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      - name: Property tests
        # RFC-0.24-002 Slice 6: fjell-proptest's 24 proptest! cases all live
        # in tests/ (harness.rs, verus_lemma_properties.rs), not src/ — with
        # --lib this job ran 0 tests and reported green (RFC-0.24-001 Pass
        # 4). fjell-store-model and fjell-bootctl-model hold their cases in
        # src/ and are correctly covered by --lib; left unchanged.
        run: |
          cargo test -p fjell-proptest
          cargo test -p fjell-store-model   --lib
          cargo test -p fjell-bootctl-model --lib

  ci-unsafe-audit:
    name: unsafe-audit
    runs-on: ubuntu-24.04
    needs: [ci-check]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      - name: Unsafe audit (category= check)
        run: cargo run -p fjell-unsafe-audit -- --workspace . --check

  ci-host-bins:
    name: host-bins
    runs-on: ubuntu-24.04
    needs: [ci-check]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      # RFC-0.29-001 R1 (E-013): the gate tools' own tests -- Gate 12's ten
      # subchecks, Gate 11's five callsite checks, and the rest of the
      # crates `--lib` alone cannot reach -- run nowhere in CI today. Same
      # command as test-all's tier 1b (cargo_metadata::host_bin_test_argv),
      # so the two never drift apart.
      - name: cargo xtask host-bin-tests
        run: cargo xtask host-bin-tests

  ci-repro-check:
    name: repro-check
    runs-on: ubuntu-24.04
    needs: [ci-check]
    steps:
      - uses: actions/checkout@v7
      # `llvm` gives llvm-objcopy/llvm-nm (qemu.rs:181,242); `ld.lld` is in
      # the separate `lld` package, which no job has ever installed - the
      # apt blocks asked for `llvm` alone and died at -Z build-std long
      # before the linker was reached, so nothing ever found out.
      - name: Install LLVM binutils and ld.lld
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm lld
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      # RFC-0.30-001 §5: the real two-build reproducibility check, on every
      # push — measured cost is a few seconds (two independent builds of the
      # kernel and all 29 services), not the "doubles CI build time" the RFC
      # worried about before anyone had timed it. Distinct from tier 3b's
      # `--skip-build` staleness check (test-all, unchanged): this one
      # actually builds, twice, and compares.
      - name: cargo xtask two-build-check
        run: cargo xtask two-build-check

  ci-arm64-check:
    name: arm64-check
    runs-on: ubuntu-24.04
    needs: [ci-check]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: ./.github/actions/toolchain
        with:
          targets: aarch64-unknown-none
      - name: cargo check arch boundary (ARM64)
        run: |
          cargo check -p fjell-arch-arm64 \
            --target aarch64-unknown-none \
            -Z build-std=core,compiler_builtins

  ci-schema-gate:
    name: schema-gate
    runs-on: ubuntu-24.04
    needs: [ci-check]
    steps:
      - uses: actions/checkout@v7
      - name: Frozen schema files present and non-empty
        # RFC-0.24-002 Slice 7: this step checks presence and non-emptiness
        # only — it does not compare against current schema definitions, so
        # it cannot detect drift. That check is a new instrument (a real
        # schema-dump/diff tool) and is out of this slice's scope; see the
        # RFC-0.24-001 close-out for the v0.25 candidate.
        #
        # The expected paths are a fixed list, not `find`'s output: `find`
        # returning nothing (e.g. every *.frozen file deleted) previously
        # made the loop body never run, printing success over an empty set
        # (RFC-0.24-001 Pass 4 / RFC-0.24-002 review). A fixed list fails
        # closed on a missing file instead of silently checking zero files.
        run: |
          echo "schema-gate: checking expected *.frozen files"
          FROZEN_FILES=(
            crates/fjell-keyring/schema/snapshot-v1.frozen
            crates/fjell-semantic-v1/schema/intent-v1.frozen
            crates/formats/fjell-attestation-format/schema/v2.frozen
            crates/formats/fjell-diag-format/schema/bundle-v1.frozen
            crates/formats/fjell-identity-format/schema/node-identity-v1.frozen
            crates/formats/fjell-platform-format/schema/board-v1.frozen
            crates/formats/fjell-snapshot-format/schema/snapshot-v2.frozen
            crates/formats/fjell-summary-format/schema/measurement-summary-v1.frozen
            crates/formats/fjell-summary-format/schema/release-summary-v1.frozen
            crates/formats/fjell-upgrade-format/schema/release-metadata-v1.frozen
            crates/formats/fjell-upgrade-format/schema/rollback-record-v1.frozen
          )
          for f in "${FROZEN_FILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: missing or empty frozen schema: $f"
              exit 1
            fi
          done
          echo "schema-gate: all ${#FROZEN_FILES[@]} expected *.frozen files present and non-empty"

  ci-qemu-v07:
    name: qemu-v07
    runs-on: ubuntu-24.04
    needs: [ci-check]
    strategy:
      fail-fast: false
      matrix:
        category: [v0.4-net, v0.5-platform, v0.7-sync]
    steps:
      - uses: actions/checkout@v7
      # `llvm` gives llvm-objcopy/llvm-nm (qemu.rs:181,242); `ld.lld` is in
      # the separate `lld` package. No job installed it before RFC-0.31-002
      # because every one of them died at -Z build-std long before a linker
      # was reached.
      - name: Install QEMU, LLVM binutils and ld.lld
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc qemu-utils llvm lld
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      - name: cargo xtask qemu-test ${{ matrix.category }}
        run: cargo xtask qemu-test ${{ matrix.category }}
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-v07-${{ matrix.category }}
          path: tests/qemu/artifacts/smoke-${{ matrix.category }}/
          if-no-files-found: warn

  # RFC-0.32-001 §7 — on every event, including push and pull request:
  # BUILD every fuzz target and REPLAY every committed seed once. This job
  # proves the targets compile and that no decoder panics on an input already
  # in the corpus. It does not fuzz, and nothing here is named as if it did —
  # the fuzz run is `fuzz-run`, below. Its Done lines report the seed count,
  # never fuzzing (answer document, §7).
  ci-fuzz-build:
    name: fuzz-build
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
      # §8: the nightly floats (a dated pin is not yet worth its machinery);
      # cargo-fuzz and fuzz/Cargo.lock are locked. rustup is already on the
      # runner, as the composite toolchain action relies on.
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          rustc +nightly -vV
          cargo +nightly install cargo-fuzz --locked --version 0.13.2
          cargo +nightly fuzz --version
      # The run matrix is derived here, from cargo-fuzz's own target list —
      # never hand-listed (E-014's family). Positive control: an empty list,
      # or a target with no seeds (D3), fails rather than yielding a matrix
      # of nothing.
      - name: List fuzz targets
        id: list
        run: |
          targets=$(cargo +nightly fuzz list)
          if [ -z "$targets" ]; then
            echo "::error file=fuzz/Cargo.toml::cargo fuzz list returned no targets; refusing to report a matrix of nothing"
            exit 1
          fi
          for t in $targets; do
            if [ -z "$(ls -A "fuzz/corpora/$t" 2>/dev/null)" ]; then
              echo "::error file=fuzz/Cargo.toml::target $t has no seeds in fuzz/corpora/$t (RFC-0.32-001 D3)"
              exit 1
            fi
          done
          echo "targets=$(printf '%s\n' $targets | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          printf '%s\n' $targets
      # Nightly drift lands in this step: a compile error and no artifact.
      - name: Build fuzz targets
        run: cargo +nightly fuzz build
      # A real crash on a known input lands in this step, with its input
      # uploaded below. -runs=0 executes each seed once and mutates nothing.
      - name: Replay committed seeds
        run: |
          rc=0
          for t in $(cargo +nightly fuzz list); do
            mkdir -p "fuzz/corpus/$t"
            cargo +nightly fuzz run "$t" "fuzz/corpus/$t" "fuzz/corpora/$t" -- -runs=0 || rc=1
          done
          exit $rc
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-build-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # RFC-0.32-001 D4/D5 — the fuzz run: on schedule, and on demand through
  # workflow_dispatch so a fix is proven the day it lands. Each target for 300
  # seconds, from its committed seeds. Evidence of fuzzing is this job's run id
  # and libFuzzer's `Done N runs in M second(s)` line per target, nothing else.
  #
  # It runs even when fuzz-build's replay failed, as long as fuzz-build got as
  # far as listing the targets: one target crashing on a seed must not stop
  # the other targets being fuzzed.
  ci-fuzz-run:
    name: fuzz-run
    runs-on: ubuntu-24.04
    needs: [ci-fuzz-build]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.ci-fuzz-build.outputs.targets != '' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.ci-fuzz-build.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          rustc +nightly -vV
          cargo +nightly install cargo-fuzz --locked --version 0.13.2
          cargo +nightly fuzz --version
      - name: Fuzz ${{ matrix.target }} for 300 seconds
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          cargo +nightly fuzz run "${{ matrix.target }}" \
            "fuzz/corpus/${{ matrix.target }}" "fuzz/corpora/${{ matrix.target }}" \
            -- -max_total_time=300
      # cargo-fuzz writes a crashing input to fuzz/artifacts/<target>/. The job
      # this replaces uploaded only fuzz/corpus/, so a crash on CI would have
      # turned it red and discarded the one input that explains it (E-043).
      - name: Upload crashing input
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
      # D3: the grown corpus is kept as a run artifact, not written back into
      # the tree. Promoting an input into fuzz/corpora/ is a reviewed commit.
      - name: Upload grown corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: warn

  # RFC-0.32-002 §D — undefined-behaviour detection on the crates this line
  # made safe. Miri interprets the code and reports UB that compiles and runs
  # clean natively; it is the tool that named the defect E-046 describes, at
  # `.correlation_id.<enum-tag>`, before the decoder replaced it.
  #
  # Schedule and dispatch only, like fuzz-run and for the same reason: Miri is
  # slow, and the project's rule is that gates stay local and CI records
  # (RFC-0.31-002 D7). The counter-argument in the handoff's §D is why it is
  # here at all rather than local-only — a check that runs only where the
  # toolchain happens to be installed is a check nobody runs, which is E-049
  # one crate over. The component is installed explicitly, so a runner without
  # it fails this job rather than skipping silently.
  #
  # Named for what it proves: these crates' tests execute without undefined
  # behaviour. It does not prove the services do — they are no_std riscv64
  # binaries Miri cannot run, and the QEMU tiers are their evidence.
  ci-miri:
    name: miri
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly with miri
        run: |
          rustup toolchain install nightly --profile minimal \
            --component miri --component rust-src
          cargo +nightly miri --version
      # Positive control: a crate whose tests Miri must be able to run at all.
      # If this step reports zero tests, the job below proves nothing.
      - name: No undefined behaviour in the wire codec and the checksum paths
        run: |
          cargo +nightly miri test \
            -p fjell-semantic-format \
            -p fjell-store-format \
            -p fjell-upgrade-format

  # Verus proof machine-check (RFC-v0.17-005 / RFC-v0.18-001).
  # NON-BLOCKING on push: continue-on-error keeps Verus off the merge path
  # (never a Fjell build dependency). This job RECORDS the VERUS:TARGET:*
  # markers per milestone (the promotion-ledger evidence). The BLOCKING gate
  # for release-required targets (capability, lease) lives in the release-time
  # `release-rehearsal` (Gate 10), not here. Pin: TOOLCHAIN.lock.
  ci-verus:
    name: verus
    runs-on: ubuntu-24.04
    needs: [ci-check]
    continue-on-error: true
    env:
      VERUS_TAG: release/0.2026.05.24.ecee80a
      VERUS_ASSET: verus-0.2026.05.24.ecee80a-x86-linux.zip
      VERUS_TOOLCHAIN: 1.95.0-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - name: Install unzip (for the pinned Verus bundle)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
      - name: Install toolchain
        uses: ./.github/actions/toolchain
      - name: Install rustup toolchain Verus requires
        run: rustup toolchain install "$VERUS_TOOLCHAIN" --profile minimal
      - name: Install pinned Verus (bundled z3)
        run: |
          TAG_ENC=$(printf '%s' "$VERUS_TAG" | sed 's#/#%2F#g')
          URL="https://github.com/verus-lang/verus/releases/download/${TAG_ENC}/${VERUS_ASSET}"
          curl -sL --max-time 300 "$URL" -o /tmp/verus.zip
          mkdir -p /tmp/verus && unzip -q /tmp/verus.zip -d /tmp/verus
          VDIR=$(dirname "$(find /tmp/verus -name verus -type f | head -1)")
          chmod +x "$VDIR"/verus "$VDIR"/rust_verify "$VDIR"/z3 || true
          echo "$VDIR" >> $GITHUB_PATH
      - name: Verus version
        run: verus --version
      - name: Machine-check pilot proofs + record markers
        run: |
          cargo run -q -p fjell-tools -- verus-check --all-pilot \
            | tee verus-markers.txt
          echo "### Verus machine-check ($VERUS_TAG)" >> $GITHUB_STEP_SUMMARY
          grep 'VERUS:TARGET' verus-markers.txt >> $GITHUB_STEP_SUMMARY || true
          # Surface a real proof FAIL loudly without gating the pipeline.
          if grep -qE 'MACHINE-CHECKED-FAIL|CONFORMANCE-FAIL' verus-markers.txt; then
            echo "::warning::a Verus proof target FAILED (non-blocking, Stage A)"
          fi
      - name: Upload marker log (milestone record)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verus-markers
          path: verus-markers.txt
          if-no-files-found: warn
