# RFC-0.38-001 (E-086, E-085): the measurement chain measures something.
#
# The kernel hashes the service images it embeds and hands the result to `init`
# in `BootInfo`; `init` gives it to `measuredd`, which records it as the chain's
# first event. This tier asserts that what was RECORDED is what the images HASH
# TO -- not that a digest is present, non-zero or well-formed, but that it is
# EQUAL to a value the host derives on its own.
#
# `expect_image_set_digest` names two lines the run must print, each followed by
# the 64 hex digits the host recomputes when the run is judged:
#
#   * the kernel's own boot line (what it computed), and
#   * `measuredd`'s line (what the chain recorded, read back out of the stored
#     event, not echoed from the request).
#
# The host value comes from `crates/fjell-kernel/prebuilt/*.bin` through the
# external `sha2` crate, the documented layout assembled by hand and a file ->
# ImageId table that does not use the kernel's own (see `fjell-tools`'
# `image_set.rs`). It is derived at judging time, so this file holds no digest to
# go stale. Two lines make the agreement three-way, which also says where a
# disagreement is: kernel vs host is the content; kernel vs measuredd is the
# transfer.
#
# What this does NOT show, and the limitations page says: only the service
# images are measured (not the kernel's own image, configuration or runtime
# state); and three of the chain's four recorded events are still placeholders
# (RFC-0.38-001 R7). It says nothing about the attestation record, which is
# built from constants independently of the chain (E-094).

name                    = "measurement"
timeout_secs            = 60
expected_markers = [
  "M8: boot evidence imported",
  "M8: verification results appended",
  "M8: measurement chain ready",
  "measuredd: event seq=1 kind=1 source=1 subject=1",
  "measuredd: event seq=2 kind=2 source=13 subject=2",
  "measuredd: event seq=3 kind=3 source=13 subject=3",
  "measuredd: event seq=4 kind=4 source=13 subject=4",
  "attestd: record verified_flags=0",
  "attestd: record availability kernel_digest=0 release_digest=0 rootfs_digest=0 policy_digest=0 snapshot_digest=0 measurement=1",
  "attestd: record measurement head_seq=4 included=1..4",
]
# RFC-0.39-001 R5: what the chain RECORDED for each event, read back out of the
# stored event (`measuredd: event seq=N kind=K source=S subject=J`, wire values).
# Seq 1 is the image-set digest, produced by the kernel (source 1 = Kernel). Seq
# 2-4 are the three placeholder verification results, which `init` invented, so
# the producer is `Init` (source 13); they used to be recorded as source 2
# (Verifyd), a service that had no part in them (E-096).
once_markers = [
  "measuredd: image-set digest ",
  "measuredd: event seq=1 kind=1 source=1 subject=1",
  "measuredd: event seq=2 kind=2 source=13 subject=2",
  "measuredd: event seq=3 kind=3 source=13 subject=3",
  "measuredd: event seq=4 kind=4 source=13 subject=4",
]
expect_image_set_digest = [
  "images, digest sha256:",
  "measuredd: image-set digest ",
]
# RFC-0.40-001 R6 (closes E-094): what the signed attestation record CLAIMS, read
# out of the record `attestd` is signing (nothing outside the service could read it
# before). The record used to assert that a release, a rootfs and a policy bundle
# had each been verified (nothing verifies any of them), over five literal digests,
# with a measurement section of `head_seq: 1` and chain digest `0x55..`. Now:
#   * `verified_flags=0`  -- none of the three verifications happened;
#   * every digest nothing computes is `=0` (unavailable), zero beside its flag;
#   * the measurement section is the REAL chain: `head_seq=4 included=1..4` and a
#     chain digest EQUAL to the head the host derives independently
#     (`expect_chain_head`; not merely non-zero).
# Still true and still NOT claimed: the kernel's own image is unmeasured and
# release/rootfs/policy verification does not exist (E-095); this makes the
# record truthful, not complete.
expect_chain_head = [
  "attestd: record measurement chain_digest sha256:",
]
extra_args              = []
