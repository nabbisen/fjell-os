# Negative-test profile: store
# Tests for RFC-v0.1.x-003 (RFC 026) store corruption/recovery rejection.
# These are testable at v0.1.x: the store recovery path is in user-space
# and the CRC32 / partial-tail rejection is part of the M5 baseline.

name             = "store"
timeout_secs     = 60
expected_markers = [
    "NEG:STORE:CORRUPT_RECORD_REJECTED:PASS",
    "NEG:STORE:PARTIAL_TAIL_IGNORED:PASS",
    "NEG:STORE:BAD_SUPERBLOCK_MIRROR_REJECTED:PASS",
    "NEG:STORE:VALID_PREFIX_RECOVERED:PASS",
]
extra_args       = []

# RFC-0.29-001 D5: this profile has a marker specification but no emitting
# scenario yet (v1-limitations.md) — running it fails honestly rather than
# placeholder-passing. It is still derived into scope (D1) and runs like
# any other category; only its result is excluded from release gating.
release_gated    = false
not_gated_reason = "no emitting scenario yet; markers are specified but nothing produces them (v1-limitations.md)"
