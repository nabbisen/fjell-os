# RFC 034 (v0.2): blocked IPC revocation semantics.
# Three scenarios exercised by neg-test + sample-service cooperation.

name             = "ipc"
timeout_secs     = 90
expected_markers = [
  "NEG:IPC:BLOCKED_RECV_WAKES_ON_REVOKE:PASS",
  "NEG:IPC:BLOCKED_CALL_WAKES_ON_REVOKE:PASS",
  "NEG:IPC:LATE_REPLY_REJECTED:PASS",
]
# All three markers confirmed real in v0.20.0 after three stacked fixes:
# (1) IPC words ABI — sys_ipc_call_words never packed the word count and
#     deliver() shifted words by one register, so every payload word was
#     lost; sample-service bound LeaseId(0) (a long-revoked lease) and the
#     earlier "passes" were instant-failure false positives.
# (2) lease revoke now cancels server-side reply edges and wakes blocked
#     callers (RFC 050), removing the timing-dependent neg-test hang.
# (3) markers are emitted only on the contract-specified error (fail-closed).
extra_args       = []
