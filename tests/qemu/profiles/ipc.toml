# RFC 034 (v0.2): blocked IPC revocation semantics.
# Three scenarios exercised by neg-test + sample-service cooperation.

name             = "ipc"
timeout_secs     = 90
expected_markers = [
  "NEG:IPC:BLOCKED_RECV_WAKES_ON_REVOKE:PASS",
  "NEG:IPC:BLOCKED_CALL_WAKES_ON_REVOKE:PASS",
]
# NEG:IPC:LATE_REPLY_REJECTED:PASS — pending investigation.
# The scenario requires neg-test to reply after lease revoke (RFC 034/050:
# the reply edge should return BadState/LeaseRevoked). The BLOCKED_CALL marker
# fires correctly (sample's ipc_call is woken by revoke) but sys_ipc_reply
# blocks indefinitely in the test run, indicating the reply edge is not
# being cancelled correctly from the server side on lease revocation in
# the dedicated-endpoint path. Tracked as a kernel correctness finding.
extra_args       = []
