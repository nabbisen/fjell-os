# RFC-v0.23-001 (ABDD Live Path): semantic-stream and proxy-text run as live
# IPC participants; sample-service emits an intent node that is routed and
# rendered by the proxy task (not by init); the proxy's return leg issues a
# capability-checked ActionRequest, demonstrated both accepted and refused.

name             = "semantic"
timeout_secs     = 60
# "Verified boot status", the fifth marker, is init's own emission — one of its
# 18 emit_* call sites, a different sender on the same wire from the
# sample-service path the first four exercise. RFC-0.32-002 converted
# sample-service and both receivers and missed init's sender, so every init
# emission was refused at BEGIN for the whole of 0.32.0's development and no
# tier noticed. It is the text of the STATE line init's M7 section renders,
# without the brackets.
#
# History (E-057, closed by RFC-0.33-004 D6): the profile reader used to close the
# array at the first `]` and split on every comma, so a marker like
# "[INTENT][Normal] sample-service demo intent" silently cost this tier 2 of its 4
# markers, and these markers were written bracket-free to avoid it. The reader now
# respects quoting, so the bracketed form would load whole; the markers here were
# left as they are because changing what a tier asserts is not this fix's to do.
expected_markers = [
    "M5: semantic operations ready",
    "sample-service demo intent",
    "proxy-text: action accepted",
    "proxy-text: action DENIED (capability not held)",
    "Verified boot status",
]
extra_args       = []
