# RFC-0.33-001 D15/D17: the reset mechanism, demonstrated on its own.
#
# bootctl's health decision cannot reach a reset in this deployment (health-fail
# shows why: one image, no slot switching, the active slot is also the last
# confirmed one -- D14), so the mechanism it would use is exercised here by
# neg-test instead: the PlatformReboot dispatch arm, its capability check, the
# MMIO write, and R6's harness. THE TWO ARE NOT JOINED. The health *decision* is
# demonstrated end to end by `health-fail`; the *reset* is demonstrated end to
# end by this profile; joining them needs slot switching (D7) and a durable
# block (section A). Neither profile implies otherwise.
#
# THE TRIGGER (D17): a console byte, `R`, injected once after "driver-uart:
# ready". init reads it and sends neg-test one message over neg-test's own
# endpoint; neg-test then runs the scenario. **A trigger for a reset must not
# survive the reset.** This profile's first version armed the scenario with a
# virtio entropy device on the bus, which is still there after the reset: a
# machine with one resets, boots and resets again. The tier hid that only because
# the harness passes -no-reboot, so QEMU exits instead of rebooting. The byte is
# injected once by an external agent and is absent on the next boot, so it cannot
# loop -- checked, not assumed, by `tests/qemu/scripts/reset_boots_once.py`, run by
# hand (no tier boots a second time: the harness passes -no-reboot). That check
# found the machine did NOT boot again after its reset -- satp survived it -- and
# the kernel now clears satp at entry.
#
# What is asserted, and how:
#   * WITHOUT the right: neg-test mints its Reboot capability down to one with no
#     REBOOT right and calls sys_reboot -- refused with PermissionDenied, exactly.
#     That refusal has a marker, because it is a return value neg-test observes.
#   * WITH the right: the machine resets. NO MARKER SAYS SO. `expect_shutdown`
#     makes the harness pass this run only if QEMU's own SHUTDOWN event reports
#     guest-initiated `guest-reset` and QEMU exited by itself, not by the
#     timeout wrapper -- the machine's behaviour is the evidence. A reset that
#     did not happen is a hang or a power-off, and both fail the run
#     (crates/fjell-tools/src/qemu_shutdown.rs, five refusals, each a unit test).
#   * If sys_reboot *returns*, neg-test prints NEG:HARNESS:REBOOT_RETURNED, a
#     forbidden harness marker, and the run fails closed.
#
# This tier finishes in well under a second of *its own* time while its
# neighbours wait out a 60-second timeout: that is the machine EXITING EARLY
# because it reset, not a skipped run. It reads like a skip in the summary table;
# it is not one (controlled against a tier that waits out its timeout).

name                 = "reboot"
timeout_secs         = 60
inject_after_marker  = "driver-uart: ready"
inject_bytes         = "R"
expect_shutdown      = "guest-reset"
expected_markers = [
    "neg-test: all scenarios complete",
    "init: reset trigger received; asking neg-test to run its reboot scenario",
    "NEG:REBOOT:WITHOUT_RIGHT_REFUSED:PASS",
    "neg-test: calling sys_reboot with the Reboot right",
]
