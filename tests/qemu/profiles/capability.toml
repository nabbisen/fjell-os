# RFC 031/032/048/049 (v0.2): capability enforcement.
# RFCs 048: handle-based require_cap for task/lease syscalls.
# RFC 049: COPY/MINT/REVOKE/INSPECT management rights.

# RFC-0.38-002 (E-088) adds five markers: a capability cannot be re-bound to a
# revoked lease and stays unusable afterwards; `sys_cap_bind_lease` is refused
# without a LeaseAdmin capability holding LEASE_CREATE; and a revoked
# capability is not revived by an unprivileged bind to another lease.
#
# RFC-0.38-004 (E-090) adds four: a lease binding is set once -- a second bind
# (to another Active lease, or the same one) is refused, and revoking the lease
# the capability was first bound to still kills it; and 0.38-002's bind-to-a-
# revoked-lease refusal is kept, on an unbound capability.
#
# RFC-0.25-001 Demonstration 4 adds NEG:IRQ:BIND_WITHOUT_RIGHT_REJECTED: a
# task without IRQ_BIND is refused.
#
# (History: the profile reader used to fold a `#` comment placed inside the array
# into the last marker; a comment between entries is now ignored -- E-057, closed
# by RFC-0.33-004 D6. See semantic.toml.)

name             = "capability"
timeout_secs     = 90
expected_markers = [
  "NEG:CAP:WRONG_KIND_REJECTED:PASS",
  "NEG:CAP:RIGHTS_DENIED:PASS",
  "NEG:CAP:LEASE_REVOKED:PASS",
  "NEG:CAP:DROP_ON_REVOKED:PASS",
  "NEG:CAP:COPY_WITHOUT_RIGHT_REJECTED:PASS",
  "NEG:CAP:MINT_WITHOUT_RIGHT_REJECTED:PASS",
  "NEG:CAP:REVOKE_WITHOUT_RIGHT_REJECTED:PASS",
  "NEG:CAP:INSPECT_WITHOUT_RIGHT_REJECTED:PASS",
  "NEG:IRQ:BIND_WITHOUT_RIGHT_REJECTED:PASS",
  "NEG:CAP:REBIND_AFTER_REVOKE_REFUSED:PASS",
  "NEG:CAP:REVOKED_STAYS_REVOKED:PASS",
  "NEG:CAP:BIND_LEASE_WITHOUT_RIGHT_REJECTED:PASS",
  "NEG:CAP:BIND_LEASE_WITHOUT_AUTHORITY_REJECTED:PASS",
  "NEG:CAP:REVOKED_NOT_REVIVED_BY_UNPRIVILEGED_BIND:PASS",
  "NEG:CAP:BIND_TO_REVOKED_LEASE_REFUSED:PASS",
  "NEG:CAP:SECOND_BIND_REFUSED:PASS",
  "NEG:CAP:SAME_LEASE_REBIND_REFUSED:PASS",
  "NEG:CAP:ORIGINAL_LEASE_STILL_KILLS:PASS",
]
extra_args       = []
