# RFC 031/032/048/049 (v0.2): capability enforcement.
# RFCs 048: handle-based require_cap for task/lease syscalls.
# RFC 049: COPY/MINT/REVOKE/INSPECT management rights.

# RFC-0.25-001 Demonstration 4 adds NEG:IRQ:BIND_WITHOUT_RIGHT_REJECTED: a
# task without IRQ_BIND is refused. Note: qemu_run.rs::load_profile's
# multi-line array reader accumulates every line until it sees `]` and does
# NOT skip `#` comments inside the array — a comment placed *inside* the
# brackets (tried first, reverted) gets concatenated into the array content
# itself and corrupts the last entry. Confirmed live: the run passed every
# individual marker check via a raw log grep, but qemu_run's own check
# still reported FAIL, because expected-markers.txt showed the comment text
# merged onto the marker string. Same class of hazard `semantic.toml`
# documents for `]` inside a marker; here it is `#` inside the array block.

name             = "capability"
timeout_secs     = 90
expected_markers = [
  "NEG:CAP:WRONG_KIND_REJECTED:PASS",
  "NEG:CAP:RIGHTS_DENIED:PASS",
  "NEG:CAP:LEASE_REVOKED:PASS",
  "NEG:CAP:DROP_ON_REVOKED:PASS",
  "NEG:CAP:COPY_WITHOUT_RIGHT_REJECTED:PASS",
  "NEG:CAP:MINT_WITHOUT_RIGHT_REJECTED:PASS",
  "NEG:CAP:REVOKE_WITHOUT_RIGHT_REJECTED:PASS",
  "NEG:CAP:INSPECT_WITHOUT_RIGHT_REJECTED:PASS",
  "NEG:IRQ:BIND_WITHOUT_RIGHT_REJECTED:PASS",
]
extra_args       = []
