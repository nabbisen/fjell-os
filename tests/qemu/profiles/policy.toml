# RFC 040 (v0.2): cap-broker policy enforcement.
# Four denials (default deny, bootstrap guard, deny priority, identity), then -- RFC-0.45-002 --
# the grant path: install, use, revoke kills, a foreign lease refused, an unmapped class refused.

name             = "policy"
timeout_secs     = 90
expected_markers = [
  "NEG:POLICY:DEFAULT_DENY:PASS",
  "NEG:POLICY:BOOTSTRAP_GUARD:PASS",
  "NEG:POLICY:DENY_PRIORITY:PASS",
  "NEG:POLICY:IDENTITY_SPOOFING_REJECTED:PASS",
  # RFC-0.45-002 (closes E-123): the first runtime-installed capability, and what bounds it.
  "NEG:CAP_INSTALL:WITHOUT_AUTHORITY_REJECTED:PASS",
  "NEG:CAP_INSTALL:WITHOUT_RIGHT_REJECTED:PASS",
  "NEG:CAP_INSTALL:EMPTY_SLOT_REJECTED:PASS",
  "NEG:POLICY:GRANT_INSTALLS_USABLE_CAP:PASS",
  "NEG:POLICY:GRANT_REVOKE_KILLS_CAP:PASS",
  "NEG:POLICY:REVOKE_FOREIGN_LEASE_REFUSED:PASS",
  "NEG:POLICY:UNMAPPED_CLASS_REFUSED:PASS",
  # ...and the broker's own words for the refusals the markers above only see as CAP_DENIED /
  # usize::MAX: a refusal by default-deny, an earlier and different path, must not pass them.
  "cap-broker: refused: resource class has no installable mapping",
  "cap-broker: CAP_REVOKE refused (not the grantee, or not a granted lease)",
]
extra_args       = []
