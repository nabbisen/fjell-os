# Negative-test profile: remote-diag
# RFC-0.37-001: the conversation RFC-v0.8-005 specifies, made real within one
# node. `fleetd` has no event loop at all before this line (E-081); this
# profile is the first exercise of its real one.
#
# 'D' injected right after "driver-uart: ready" (the same console-byte-trigger
# mechanism `health-fail.toml`/`upgrade.toml` already use): `init` sends
# `fleetd` its own trigger tag over an endpoint that is `fleetd`'s alone;
# `fleetd` sends `diagnosticsd` `BUILD_BUNDLE` over the capability RFC-0.37-001
# R4 installs and blocks for the reply.
#
# Both the instigator's own read (`fleetd: bundle ready (...)`,
# `NEG:REMOTE_DIAG:BUNDLE_READY:PASS`) and the deciding service's own output
# are asserted, the pattern `health-fail.toml`/`upgrade.toml` already
# established: `diagnosticsd` prints each of the bundle's availability flags
# by name.
#
# RFC-0.39-002: `measurement_head_available` is `true` now (slot 4 is a CALL
# capability to `measuredd`), and the tier asserts what that means rather than
# only that it is so:
#
#   * the head EQUALS the value the host derives on its own
#     (`expect_chain_head`: external `sha2`, the four events a boot appends
#     written out in `chain_head.rs`, the image-set digest recomputed from the
#     prebuilt images). Not "non-zero": a non-zero head passes against a
#     placeholder chain reported as a measured one.
#   * the COMPOSITION the bundle carries: 4 events, 1 of them with a digest the
#     kernel produced. The other 3 are `init`'s literal `0xAB` (E-095), and the
#     bundle says so by number -- that disclosure, not the flag, is the point.
#
# The other three flags still read `false`: `audit_available` and the keyring
# and attestation flags have never had a source (RFC-0.36-001), and
# `last_attestation_available` stays `false` because the signed attestation
# record is independent constants (E-094) and this line does not touch it.

name                 = "remote-diag"
timeout_secs         = 60
inject_after_marker  = "driver-uart: ready"
inject_bytes         = "D"
expected_markers = [
    "init: remote-diag trigger received; asking fleetd to run its scenario",
    "fleetd: remote-diag trigger received; asking diagnosticsd for a bundle",
    "diagnosticsd: bundle built",
    "diagnosticsd: measurement_head_available=true",
    "diagnosticsd: measurement_event_count=4",
    "diagnosticsd: measurement_events_kernel_digested=1",
    "diagnosticsd: keyring_anchor_epoch_available=false",
    "diagnosticsd: last_attestation_available=false",
    "diagnosticsd: audit_available=false",
    "fleetd: bundle ready (audit_event_count=0)",
    "NEG:REMOTE_DIAG:BUNDLE_READY:PASS",
]
expect_chain_head = [
    "diagnosticsd: measurement_head sha256:",
]
extra_args       = []
