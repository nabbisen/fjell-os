# Fleet demo QEMU profile — RFC-v0.10-005.
# Exercises the three-node QEMU fleet pass markers.
#
# NOTE: This profile requires three simultaneous QEMU instances, so it is NOT run by
# `cargo xtask test-all` and no CI workflow names it (this header used to say it ran in the
# smoke tier, which it never did; corrected with E-135). It is run by hand: `cargo xtask
# fleet-demo up` then `verify`. That runner does not go through `run_profile`, so this profile
# has no recorded marker artefacts; the `qemu-records` subcheck waives it by name for that reason.

name             = "fleet-demo"
timeout_secs     = 120
expected_markers = [
    "FLEET:NODE_A:READY",
    "FLEET:NODE_B:READY",
    "FLEET:NODE_C:READY",
    "TEST:V0.10-FLEET-DEMO:PASS",
]
extra_args       = []

# Multi-node profiles use a custom runner (`crates/fjell-tools/src/fleet_demo.rs`); the
# standard single-QEMU runner is not sufficient. `qemu_run::discover_negative_categories`
# excludes a `multi_node` profile, which is why `qemu-negative` never lists this one.
multi_node = true
