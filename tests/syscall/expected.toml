# Syscall surface expectations (RFC-v0.22-001 Slice 1).
#
# Update this file deliberately whenever crates/fjell-abi/src/syscall.rs's
# SyscallNumber enum or crates/fjell-kernel/src/trap/syscall.rs's dispatch
# match changes. `cargo run -p fjell-consistency-check -- syscall-surface`
# fails if the source and this file disagree, in either direction: a
# syscall added to the enum without updating this file, or an entry here
# naming a syscall that no longer exists.
#
# `undispatched` is deliberately the explicit set of names, not a bare
# count — a count would let one undispatched syscall silently replace
# another and still pass.

declared_count = 36
dispatched_count = 35

# RFC-0.49-001: TaskKill (43) is dispatched (`sys_task_kill`): it destroys a task and frees its slot.
# RFC-0.49-002: MmioUnmap (91) is dispatched (`sys_mmio_unmap`): the explicit, capability-checked, verified unmap DMA already had.
# Both counts' dispatched side rises by two; declared stays 36.
#
# THE RULE (RFC-0.49-002 D7): every declared syscall is dispatched, or it is retired. `syscall-surface` FAILS on a declared
# variant with no dispatch arm. The old `undispatched = [..]` list is RETIRED (the parser refuses the key): it recorded the
# state, so a new undispatched variant passed by being added to it.
#
# `held` is a dated exception to the rule, the shape `unsafe-audit`'s seeded exemptions have. It needs a reason and an expiry,
# fails when it names a syscall that is no longer undispatched, and FAILS once the workspace version is past `held_until`.
# It holds `DmaShare` (111) for ONE reason and ONE milestone: retiring it turns the documented "intended mechanism" for bulk
# transfer into a stated v1 limit (no shared-region syscall exists; transfer is chunked at 32 bytes per round trip), a product
# decision the architect has put to the owner. When the owner rules, the hold is deleted in the same change that retires the
# variant (or implements it).
held = ["DmaShare"]
held_until = "0.49.0"
held_reason = "retiring DmaShare states that v1 has no shared-region bulk transfer; that is the owner's decision (RFC-0.49-002 D6)"
