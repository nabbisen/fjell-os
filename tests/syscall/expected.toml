# Syscall surface expectations (RFC-v0.22-001 Slice 1).
#
# Update this file deliberately whenever crates/fjell-abi/src/syscall.rs's
# SyscallNumber enum or crates/fjell-kernel/src/trap/syscall.rs's dispatch
# match changes. `cargo run -p fjell-consistency-check -- syscall-surface`
# fails if the source and this file disagree, in either direction: a
# syscall added to the enum without updating this file, or an entry here
# naming a syscall that no longer exists.

declared_count = 35
dispatched_count = 35

# RFC-0.49-001: TaskKill (43) is dispatched (`sys_task_kill`): it destroys a task and frees its slot.
# RFC-0.49-002: MmioUnmap (91) is dispatched (`sys_mmio_unmap`): the explicit, capability-checked, verified unmap DMA already had.
# RFC-0.49-002 D6: DmaShare (111) is RETIRED -- the variant and its `from_u32` arm are gone, the number is not reused (as `Reboot`
# (120) was not). The declared count falls from 36 to 35, and every one of the 35 is dispatched.
#
# THE RULE (RFC-0.49-002 D7): every declared syscall is dispatched, or it is retired. `syscall-surface` FAILS on a declared
# variant with no dispatch arm. The old `undispatched = [..]` list is RETIRED (the parser refuses the key): it recorded the
# state, so a new undispatched variant passed by being added to it.
#
# `held` is a dated exception to the rule, the shape `unsafe-audit`'s seeded exemptions have: `held = ["Name"]`, with
# `held_reason` and `held_until = "X.Y.Z"` beside it. It needs a reason and an expiry, fails when it names a syscall that is
# no longer undispatched, and FAILS once the workspace version is past `held_until`. Nothing is held today; the mechanism is
# kept (and tested) because a milestone may need it again. Its one use so far, `DmaShare` at 0.49, ended with the variant.
