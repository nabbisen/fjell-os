[package]
name        = "fjell-repro-check"
description = "Verify Fjell release builds are bit-for-bit reproducible (RFC-v0.10-003)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "fjell-repro-check"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
# RFC-0.30-003 D2: the one shared `rustc -vV` observer, so the baseline's
# recorded toolchain and the provenance/trust-report ones (fjell-tools)
# never drift into two different ideas of "what we observed".
fjell-consistency-check = { path = "../fjell-consistency-check" }
